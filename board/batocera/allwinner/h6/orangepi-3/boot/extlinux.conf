LABEL batocera.linux
  LINUX /boot/linux
  FDT /boot/sun50i-h6-orangepi-3.dtb
  APPEND initrd=/boot/initrd.lz4 label=BATOCERA rootwait quiet loglevel=0 console=ttyS0,115200 console=tty3

# Composite video + analog audio on the 3.5 mm AV jack (HDMI disabled).
# To use it, add "DEFAULT batocera-cvbs" as the first line of this file.
# For PAL instead of NTSC, append sun50i_ac200_tve.default_pal=1 to APPEND.
LABEL batocera-cvbs
  LINUX /boot/linux
  FDT /boot/sun50i-h6-orangepi-3-cvbs.dtb
  APPEND initrd=/boot/initrd.lz4 label=BATOCERA rootwait quiet loglevel=0 console=ttyS0,115200 console=tty3
